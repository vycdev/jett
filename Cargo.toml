[workspace]
resolver = "2"
members = [
    "crates/jett_common",
    "crates/jett_diagnostics",
    "crates/jett_project",
    "crates/jett_lexer",
    "crates/jett_parser",
    "crates/jett_ast",
    "crates/jett_resolve",
    "crates/jett_types",
    "crates/jett_typecheck",
    "crates/jett_comptime",
    "crates/jett_fmt",
    "crates/jett_query",
    "crates/jett_driver",
    "crates/jett_lsp",
    "crates/jett_profiler",
    "crates/jett_cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# Internal crates
jett_common = { path = "crates/jett_common" }
jett_diagnostics = { path = "crates/jett_diagnostics" }
jett_project = { path = "crates/jett_project" }
jett_lexer = { path = "crates/jett_lexer" }
jett_parser = { path = "crates/jett_parser" }
jett_ast = { path = "crates/jett_ast" }
jett_resolve = { path = "crates/jett_resolve" }
jett_types = { path = "crates/jett_types" }
jett_typecheck = { path = "crates/jett_typecheck" }
jett_comptime = { path = "crates/jett_comptime" }
jett_fmt = { path = "crates/jett_fmt" }
jett_query = { path = "crates/jett_query" }
jett_driver = { path = "crates/jett_driver" }
jett_lsp = { path = "crates/jett_lsp" }
jett_profiler = { path = "crates/jett_profiler" }

# External crates
clap = { version = "4", features = ["derive"] }
tower-lsp = "0.20"
tokio = { version = "1", features = ["full"] }
serde_json = "1"
rand = "0.8"
salsa = "=0.28.2"
subtle = "2"
unicode-segmentation = "1"
sha2 = "0.10"

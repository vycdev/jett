[package]
name = "jett_runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
unicode-segmentation.workspace = true
subtle.workspace = true
rand.workspace = true
serde_json.workspace = true
font8x8 = "0.3.1"
# Keep the macOS focus-reporting adapter in graphics.rs aligned with this version.
minifb = "=0.28.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Globalization"] }

# Declare this compiler-test cfg without enabling it in this crate or dependencies.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(jett_resource_native_test_archive)"] }

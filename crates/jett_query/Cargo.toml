[package]
name = "jett_query"
description = "Incremental compiler query database and stable source identity"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
jett_common.workspace = true
jett_diagnostics.workspace = true
jett_parser.workspace = true
